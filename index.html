<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極功德無量放生系統</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #0f0f12;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, #2a2208 0%, #0f0f12 70%);
        }
        .sidebar {
            width: 420px;
            background-color: #18181c;
            border-left: 2px solid #2d2d35;
            display: flex;
            flex-direction: column;
        }
        .tabs {
            display: flex;
            background-color: #121215;
            border-bottom: 1px solid #2d2d35;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: #888;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            color: #ffd700;
            border-bottom: 3px solid #ffd700;
            background-color: #18181c;
        }
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        h1 {
            color: #ffd700;
            font-size: 32px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .score-display {
            font-size: 36px;
            font-weight: bold;
            color: #00ffcc;
            margin: 10px 0;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }
        .stats-display {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .click-target {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #111;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .click-target:active {
            transform: scale(0.92);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
        }
        .float-text {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
        .shop-item {
            background-color: #222228;
            border: 1px solid #33333d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info { flex: 1; padding-right: 10px; }
        .item-title { font-weight: bold; color: #fff; font-size: 15px; }
        .item-desc { font-size: 12px; color: #888; margin: 4px 0; }
        .item-cost { font-size: 13px; color: #ff6b6b; font-weight: bold; }
        .item-count { font-size: 12px; color: #ffd700; margin-top: 2px; }
        .buy-btn {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            min-width: 80px;
        }
        .buy-btn:disabled {
            background: #3a3a42;
            color: #666;
            cursor: not-allowed;
        }
        .action-btns {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        .small-btn {
            background: #2d2d35;
            color: #ccc;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="main-panel" id="mainPanel">
        <h1>功德無量放生系統</h1>
        <div class="score-display" id="meritDisplay">功德：0</div>
        <div class="stats-display" id="statsDisplay">
            手動敲擊：+1 / 次 | 自動巡航：+0 / 秒
        </div>
        
        <div class="click-target" id="clickTarget" onclick="clickMerit(event)">
            敲木魚
        </div>

        <div class="action-btns">
            <button class="small-btn" onclick="saveGame()">儲存進度</button>
            <button class="small-btn" onclick="resetGame()">重置遊戲</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('upgrades')">法器升級</button>
            <button class="tab-btn" onclick="switchTab('auto')">自動化加持</button>
            <button class="tab-btn" onclick="switchTab('release')">極致放生</button>
        </div>

        <div class="tab-content" id="upgradesTab"></div>
        <div class="tab-content" id="autoTab" style="display:none;"></div>
        <div class="tab-content" id="releaseTab" style="display:none;"></div>
    </div>

<script>
    // 遊戲核心數據
    let gameData = {
        merit: 0,
        clickPower: 1,
        autoPower: 0,
        globalMultiplier: 1,
        items: {}
    };

    // 1. 手動點擊升級（增加單次點擊收益）
    const clickItems = [
        { id: 'c1', name: '電子木魚棒', baseCost: 15, power: 1, desc: '輕量化塑料材質，敲擊更省力。' },
        { id: 'c2', name: '開光黃銅磬', baseCost: 100, power: 5, desc: '聲音清脆，清心寡欲，功德加倍。' },
        { id: 'c3', name: '高頻震動木魚', baseCost: 1100, power: 30, desc: '引進工業級震動馬達，極速獲取功德。' },
        { id: 'c4', name: '鈦合金金剛杖', baseCost: 12000, power: 200, desc: '航太等級材質，一杖敲下，罪孽全消。' },
        { id: 'c5', name: '量子微粒神木', baseCost: 130000, power: 1500, desc: '微觀層面引發波函數坍縮，直接產生功德。' },
        { id: 'c6', name: '反物質神聖大鐘', baseCost: 1500000, power: 10000, desc: '正反物質湮滅轉化為極致純淨的功德。' },
        { id: 'c7', name: '曲速引擎法輪', baseCost: 20000000, power: 80000, desc: '扭曲時空進行光速旋轉，功德產出超越光速。' }
    ];

    // 2. 自動化加持（每秒自動獲得功德）
    const autoItems = [
        { id: 'a1', name: '藍芽自動念經機', baseCost: 50, power: 2, desc: '循環播放大悲咒 24 小時不間斷。' },
        { id: 'a2', name: '打坐小沙彌', baseCost: 500, power: 15, desc: '僱用小沙彌幫忙線上誠心祈福。' },
        { id: 'a3', name: '電子轉經輪伺服器', baseCost: 4000, power: 100, desc: '架設在雲端資料中心的轉經輪，每秒十萬轉。' },
        { id: 'a4', name: 'AI 菩提大模型', baseCost: 50000, power: 800, desc: '神經網絡自我訓練，精通一切經文大法。' },
        { id: 'a5', name: '賽博朋克超空洞寺廟', baseCost: 600000, power: 5000, desc: '霓虹燈閃爍的未來寺廟，香火永續。' },
        { id: 'a6', name: '戴森球功德採集陣', baseCost: 10000000, power: 45000, desc: '包覆整顆恆星，將恆星能完全轉化為功德。' },
        { id: 'a7', name: '多元宇宙信仰矩陣', baseCost: 150000000, power: 300000, desc: '抽離無數平行宇宙的信仰能量。' }
    ];

    // 3. 放生系統（全域倍率乘數）
    const releaseItems = [
        { id: 'r1', name: '放生瓶裝礦泉水', baseCost: 500, mult: 0.1, desc: '「讓水分子重獲自由。」（全域功德 +10%）' },
        { id: 'r2', name: '放生淡水小金魚', baseCost: 5000, mult: 0.2, desc: '放入大海，祝牠自求多福。（全域功德 +20%）' },
        { id: 'r3', name: '放生外來種巴西龜', baseCost: 50000, mult: 0.35, desc: '生態系的災難，功德界的新星。（全域功德 +35%）' },
        { id: 'r4', name: '放生高壓電線桿', baseCost: 600000, mult: 0.5, desc: '讓電流回歸大自然。（全域功德 +50%）' },
        { id: 'r5', name: '放生核廢料水', baseCost: 8000000, mult: 0.8, desc: '變異就是進化，大愛無疆。（全域功德 +80%）' },
        { id: 'r6', name: '放生太陽系', baseCost: 100000000, mult: 1.5, desc: '擺脫引力束縛，讓九大行星各奔東西。（全域功德 +150%）' },
        { id: 'r7', name: '放生時間軸', baseCost: 2000000000, mult: 3.0, desc: '將時間線拋入虛無，達到永恆超脫。（全域功德 +300%）' }
    ];

    // 初始化資料結構
    function initData() {
        [...clickItems, ...autoItems, ...releaseItems].forEach(item => {
            if (!(item.id in gameData.items)) {
                gameData.items[item.id] = 0;
            }
        });
    }

    // 計算當前花費
    function getCost(item) {
        const count = gameData.items[item.id];
        return Math.floor(item.baseCost * Math.pow(1.15, count));
    }

    // 重新計算屬性值
    function recalculate() {
        let cp = 1;
        clickItems.forEach(item => {
            cp += item.power * gameData.items[item.id];
        });

        let ap = 0;
        autoItems.forEach(item => {
            ap += item.power * gameData.items[item.id];
        });

        let mult = 1;
        releaseItems.forEach(item => {
            mult += item.mult * gameData.items[item.id];
        });

        gameData.clickPower = cp;
        gameData.autoPower = ap;
        gameData.globalMultiplier = mult;
    }

    // 點擊事件與浮動文字
    function clickMerit(e) {
        const gained = gameData.clickPower * gameData.globalMultiplier;
        gameData.merit += gained;
        
        // 建立浮動文字
        const float = document.createElement('div');
        float.className = 'float-text';
        float.innerText = `功德 +${formatNum(gained)}`;
        
        // 文字出現位置
        const rect = document.getElementById('mainPanel').getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        float.style.left = `${x - 30}px`;
        float.style.top = `${y - 20}px`;
        float.style.color = Math.random() > 0.1 ? '#ffd700' : '#00ffcc';

        document.getElementById('mainPanel').appendChild(float);

        setTimeout(() => float.remove(), 1000);
        updateUI();
    }

    // 購買邏輯
    function buy(id, type) {
        let list = type === 'click' ? clickItems : (type === 'auto' ? autoItems : releaseItems);
        let item = list.find(i => i.id === id);
        let cost = getCost(item);

        if (gameData.merit >= cost) {
            gameData.merit -= cost;
            gameData.items[id]++;
            recalculate();
            updateUI();
            renderTabs();
        }
    }

    // 數字格式化
    function formatNum(num) {
        if (num >= 1e9) return (num / 1e9).toFixed(2) + ' B';
        if (num >= 1e6) return (num / 1e6).toFixed(2) + ' M';
        if (num >= 1e3) return (num / 1e3).toFixed(1) + ' K';
        return Math.floor(num).toLocaleString();
    }

    // 更新畫面
    function updateUI() {
        document.getElementById('meritDisplay').innerText = `功德：${formatNum(gameData.merit)}`;
        const currentClick = gameData.clickPower * gameData.globalMultiplier;
        const currentAuto = gameData.autoPower * gameData.globalMultiplier;
        
        document.getElementById('statsDisplay').innerText = 
            `手動敲擊：+${formatNum(currentClick)} / 次 | 自動巡航：+${formatNum(currentAuto)} / 秒 | 功德倍率：x${gameData.globalMultiplier.toFixed(2)}`;

        // 更新按鈕啟用狀態
        document.querySelectorAll('.buy-btn').forEach(btn => {
            const cost = parseFloat(btn.dataset.cost);
            btn.disabled = gameData.merit < cost;
        });
    }

    // 渲染商店頁籤
    function renderTabContent(items, elementId, type) {
        const container = document.getElementById(elementId);
        container.innerHTML = '';

        items.forEach(item => {
            const cost = getCost(item);
            const count = gameData.items[item.id];
            
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <div class="item-info">
                    <div class="item-title">${item.name}</div>
                    <div class="item-desc">${item.desc}</div>
                    <div class="item-cost">消耗：${formatNum(cost)} 功德</div>
                    <div class="item-count">已擁有：${count}</div>
                </div>
                <button class="buy-btn" data-cost="${cost}" onclick="buy('${item.id}', '${type}')">
                    購買
                </button>
            `;
            container.appendChild(div);
        });
    }

    function renderTabs() {
        renderTabContent(clickItems, 'upgradesTab', 'click');
        renderTabContent(autoItems, 'autoTab', 'auto');
        renderTabContent(releaseItems, 'releaseTab', 'release');
    }

    // 切換頁籤
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');

        if (tabName === 'upgrades') {
            document.getElementById('upgradesTab').style.display = 'block';
            event.target.classList.add('active');
        } else if (tabName === 'auto') {
            document.getElementById('autoTab').style.display = 'block';
            event.target.classList.add('active');
        } else if (tabName === 'release') {
            document.getElementById('releaseTab').style.display = 'block';
            event.target.classList.add('active');
        }
    }

    // 自動循環（每 100ms 執行一次）
    setInterval(() => {
        if (gameData.autoPower > 0) {
            gameData.merit += (gameData.autoPower * gameData.globalMultiplier) / 10;
            updateUI();
        }
    }, 100);

    // 存檔與讀檔
    function saveGame() {
        localStorage.setItem('merit_game_save', JSON.stringify(gameData));
        alert('功德進度已成功保存！');
    }

    function loadGame() {
        const save = localStorage.getItem('merit_game_save');
        if (save) {
            gameData = Object.assign(gameData, JSON.parse(save));
        }
        initData();
        recalculate();
        renderTabs();
        updateUI();
    }

    function resetGame() {
        if (confirm('確定要消除所有功德重新開始嗎？')) {
            localStorage.removeItem('merit_game_save');
            location.reload();
        }
    }

    // 初始化遊戲
    loadGame();
</script>
</body>
</html>
